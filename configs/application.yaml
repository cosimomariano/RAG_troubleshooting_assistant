application:
  name: rag-troubleshooting-assistant
  environment: ${APP_ENV}

server:
  host: ${SERVER_HOST}
  port: ${SERVER_PORT}

logging:
  level: ${LOG_LEVEL}
  format: json

llm:
  provider: ollama
  base_url: ${OLLAMA_BASE_URL}
  model: ${OLLAMA_MODEL}
  timeout_seconds: 120

ingestion:
  knowledge_base_path: ${KNOWLEDGE_BASE_PATH}
  supported_extensions:
    - .md
    - .txt
  recursive: true

#telemetry:
chunking:
  strategy: section_aware
  chunk_size_characters: 1200
  chunk_overlap_characters: 200

#embeddings:
#retrieval:
#generation:
#incident_analyzer:
