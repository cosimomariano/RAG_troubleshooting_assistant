application:
  name: rag-troubleshooting-assistant
  environment: ${APP_ENV}

server:
  host: ${SERVER_HOST}
  port: ${SERVER_PORT}

logging:
  level: ${LOG_LEVEL}
  format: json

llm:
  provider: ollama
  base_url: ${OLLAMA_BASE_URL}
  model: ${OLLAMA_MODEL}
  timeout_seconds: ${OLLAMA_TIMEOUT_SECONDS}

ingestion:
  knowledge_base_path: ${KNOWLEDGE_BASE_PATH}
  supported_extensions:
    - .md
    - .txt
  recursive: true

#telemetry:
chunking:
  strategy: section_aware
  chunk_size_characters: 1200
  chunk_overlap_characters: 200

masking:
  enabled: true
  categories:
    - credentials
    - email
    - iban
    - private_ipv4

embeddings:
  provider: sentence_transformers
  model: ${EMBEDDING_MODEL}
  batch_size: 32
  normalize: true

vector_store:
  provider: faiss
  path: ${VECTOR_STORE_PATH}
  metric: inner_product

retrieval:
  mode: ${RETRIEVAL_MODE}
  top_k: ${RETRIEVAL_TOP_K}

reranker:
  enabled: false
  provider: cross_encoder
  model: ${RERANKER_MODEL}
  batch_size: ${RERANKER_BATCH_SIZE}
  candidate_top_n: ${RERANKER_CANDIDATE_TOP_N}

#generation:
#incident_analyzer:
