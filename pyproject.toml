[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-troubleshooting-assistant"
version = "0.1.0"
description = "Assistente RAG per il troubleshooting di applicazioni a microservizi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.12,<3.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "sentence-transformers>=6.0,<7.0",
    "faiss-cpu>=1.15,<2.0",
    "rank-bm25>=0.2.2,<0.3",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = [
    "openapi-spec-validator>=0.9,<1.0",
    "pytest>=8.0,<10.0",
    "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
